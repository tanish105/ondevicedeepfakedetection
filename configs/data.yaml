dataset:
  name: faceforensicspp
  variant: c23
  frame_sample_count: 25
  image_size: 224
  manipulations:
    - df
    - nt
  negative_class: real

splits:
  train_count_per_class: 720
  val_count_per_class: 140
  test_count_per_class: 140

face_detection:
  detector: mtcnn
  keep_all: false
  select_face: largest
  margin: 0

preprocessing:
  output_frames_dir: data/processed/frames
  manifests_by_split_dir: data/processed/manifests/by_split
  local_smoke_max_videos: 4
  overwrite_images: false

calibration:
  total_frames: 500
  class_balance:
    real: 250
    fake: 250
